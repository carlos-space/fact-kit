# Settings for scripts/ci/ci-scope.sh. The script is the same file in every repository that adopts the
# flow; what differs between repositories lives here. Patterns are git glob pathspecs: "*" stays within
# one directory level, "**" crosses levels.

# Paths that never change what ci builds or tests. A commit that touches only these skips ci.
CI_SCOPE_NON_SOURCE=(
  'docs/**'
  '*.md'
  '**/CHANGELOG.md'
  '**/.release-marker'
  'release-please-config.json'
  'samples/**' # run by facts-samples.yml, not by ci
  '.release-please-manifest.json'
)

# The readers in other languages and their consumer harnesses. ci builds and tests JS only; conformance.yml tests
# the readers on every run, and verify-install.yml runs the harnesses by hand. A release branch is the exception:
# its assembled check (scripts/ci/assembled-check.sh) builds each reader and runs its harness, and a push that
# changed only these paths would otherwise skip that check, so there they count as source.
if [[ "${BRANCH:-}" != release/* ]]; then
  CI_SCOPE_NON_SOURCE+=(
    'packages/fact-kit-py/**'
    'packages/fact-kit-rs/**'
    'packages/fact-kit-go/**'
    'packages/fact-kit-swift/**'
    'consumer/**'
  )
fi

# Paths that need the macOS job. This repository has no native code of its own, but the converter runs the
# native compiler of TypeScript 7.1, which is one package per platform. The macOS job (convert-macos) runs
# when the converter, its tests or the dependency versions change.
CI_SCOPE_NATIVE=(
  'packages/fact-kit-js/src/convert.ts'
  'packages/fact-kit-js/test/convert*.test.ts'
  'packages/fact-kit-js/test/fixtures/**'
  'packages/fact-kit-js/package.json'
  'package.json'
  'pnpm-lock.yaml'
  'pnpm-workspace.yaml'
  '.github/workflows/ci.yml'
)
CI_SCOPE_NATIVE_EXCLUDE=()

# 1: a pull request here runs the same checks as the push that merges it (check, build, test on the
# whole tree), so a merge whose tree equals its pull request's green head does not run them again. A
# push to a train also runs the assembled check (pack, clean install, smoke test), which no pull request
# runs, so trains never take the pull request's run in place of their own.
if [[ "${BRANCH:-}" == release/* ]]; then CI_SCOPE_PR_TREE=0; else CI_SCOPE_PR_TREE=1; fi
