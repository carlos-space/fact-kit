name: setup-workspace
description: >
  Node and pnpm via setup actions, then a frozen install. Self-hosted runners keep a persistent pnpm
  store, so the pnpm cache is only used on GitHub-hosted runners.
inputs:
  node:
    description: install Node and pnpm (jobs that only need jq and gh set this to false)
    default: 'true'
  install:
    description: run pnpm install --frozen-lockfile
    default: 'true'
  restore-from-default:
    description: >
      space-separated paths to take from the default branch instead of the checked-out ref. Finalize jobs
      check out a product tag, whose scripts/ are frozen at release time; the tooling must come from the
      default branch or a fix landed after the tag is silently not used.
    default: ''
  registry-url:
    description: passed to setup-node for publish jobs
    default: ''
  cache:
    description: >
      restore the pnpm store cache on GitHub-hosted runners. The publish job turns it off so a release
      build never reads a cache another run could have written.
    default: 'true'
runs:
  using: composite
  steps:
    - name: tooling from the default branch
      if: inputs.restore-from-default != ''
      shell: bash
      run: |
        git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
        git checkout FETCH_HEAD -- ${{ inputs.restore-from-default }}
    # GitHub-hosted: pnpm first, because setup-node's pnpm cache needs the pnpm binary on PATH.
    # Self-hosted: Node first, because pnpm/action-setup runs its installer with whatever node is on PATH.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      if: inputs.node == 'true' && runner.environment == 'github-hosted'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.node == 'true'
      with:
        node-version: 24
        cache: ${{ inputs.cache == 'true' && runner.environment == 'github-hosted' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' && runner.environment == 'github-hosted' }}
        registry-url: ${{ inputs.registry-url }}
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      if: inputs.node == 'true' && runner.environment != 'github-hosted'
    - name: pnpm install
      if: inputs.node == 'true' && inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
