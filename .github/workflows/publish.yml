name: publish

# Publishes the units a release created: npm (fact-kit-js, fact-kit-facts), PyPI (fact-kit-py), crates.io (fact-kit-rs), and the
# Go module (fact-kit-go) and the Swift package (fact-kit-swift), which have no registry: their tag is the release record,
# and the mirror job pushes each package to its own repository (carlos-space/fact-kit-go, carlos-space/fact-kit-swift),
# where the Go proxy and SwiftPM read it.
# release-please.yml dispatches it (gh workflow run) after each release, on the release branch and with the
# train's stage; it can also be run by hand. It is not a workflow_call target: npm, PyPI and crates.io trust this
# workflow file as a Trusted Publisher, and a called workflow's OIDC token names the caller, which would not match.
#
# The stage picks the npm dist-tag: alpha, beta and rc publish under a tag of the same name and only ga
# publishes under latest, so a prerelease never becomes what `npm install` picks. PyPI and crates.io have no
# dist-tags; pip and cargo skip a prerelease unless asked. publish-units.sh refuses a unit whose version does not
# belong to the stage. Its checks run for every unit in the plan job first, so one wrong version stops the run
# before any registry is written.
#
# One job per registry, so each can fail and be re-run alone. No job runs in a GitHub Environment: the approval
# for a release is given once, before its Release PR merges, and every registry then publishes without waiting.
# Trusted Publishing is registered with this file name and no environment (PyPI: owner carlos-space, repository
# fact-kit, workflow publish.yml; crates.io: the same). npm and PyPI accept OIDC tokens only from GitHub-hosted runners. Every job is idempotent: a
# version already in a registry is skipped, so re-running after a partial failure is safe.
#
# crates.io can set up Trusted Publishing only for a crate that exists, so the first version of the crate is
# published by hand (CARGO_REGISTRY_TOKEN from the environment, never `cargo login`). Until the crate exists the
# crates job says so in its summary and publishes nothing.
#
# dry_run: every upload becomes a dry run (npm publish --dry-run, uv publish --dry-run, cargo publish
# --dry-run), to rehearse the pipeline without writing a registry. The mirror job splits the packages and prints the
# commit, tag and files it would push, and pushes nothing.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of unit paths to publish, e.g. ["packages/fact-kit-js","packages/fact-kit-py"]; each must be a key of packages in release-please-config.json'
        required: true
        type: string
      stage:
        description: 'release stage of the train; every unit version must belong to it'
        required: true
        type: choice
        options: [alpha, beta, rc, ga]
      dry_run:
        description: 'rehearse: run every upload as a dry run'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One pending run per group; only a repeat of the same request (same stage, units and mode) waits behind the
# running one.
concurrency:
  group: publish-${{ inputs.stage }}-${{ inputs.paths }}-${{ inputs.dry_run }}
  cancel-in-progress: false

jobs:
  # Which registries the units need, and every check that does not write: file version equals the manifest,
  # version belongs to the stage, unit equals its tag.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      npm: ${{ steps.reg.outputs.npm }}
      pypi: ${{ steps.reg.outputs.pypi }}
      crates: ${{ steps.reg.outputs.crates }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: reg
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          [[ ${#paths[@]} -gt 0 ]] || { echo "no unit in this release"; exit 0; }
          bash scripts/release/publish-units.sh --registries "${paths[@]}" | tee -a "$GITHUB_OUTPUT"
      - id: tag
        env:
          REGISTRIES: ${{ toJSON(steps.reg.outputs) }}
        run: |
          if jq -e '.go == "true" or .swift == "true"' <<<"$REGISTRIES" >/dev/null; then echo "tag=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check every unit
        env:
          PATHS: ${{ inputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_CHECK_ONLY: '1'
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          [[ ${#paths[@]} -gt 0 ]] || exit 0
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"

  npm:
    needs: plan
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org
          cache: 'false'
      - name: Build
        run: pnpm build
      - name: npm CLI new enough for trusted publishing
        run: |
          min=11.5.1
          if [[ "$(printf '%s\n' "$min" "$(npm --version)" | sort -V | head -1)" != "$min" ]]; then
            npm install -g "npm@^$min"
          fi
          npm --version
      # Both packages authenticate with the OIDC token, so this step sets no token. A token here would be sent
      # to registry.npmjs.org by the .npmrc setup-node writes and replace the OIDC exchange.
      - name: Publish to npm (trusted publishing)
        env:
          PATHS: ${{ inputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
          PUBLISH_REGISTRIES: npm
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"

  pypi:
    needs: plan
    if: needs.plan.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # uv builds the wheel and sdist, reads the PEP 440 version back from the wheel, and uploads with the
      # job's OIDC token (--trusted-publishing always). No PyPI token exists anywhere.
      - name: Publish to PyPI (trusted publishing)
        env:
          PATHS: ${{ inputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
          PUBLISH_REGISTRIES: pypi
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"

  crates:
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: crate
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          if bash scripts/release/publish-units.sh --crate-exists "${paths[@]}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [[ $rc == 1 ]] || { echo "::error::crates.io could not be asked whether the crate exists"; exit "$rc"; }
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the crate is not on crates.io yet, so nothing was published; its first version is published by hand"
            {
              echo "### crates.io"
              echo "- The crate does not exist on crates.io yet. Trusted Publishing can only be set up for an existing crate, so the first version is published by hand with CARGO_REGISTRY_TOKEN. Nothing was published here."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.crate.outputs.exists == 'true'
        with:
          toolchain: stable
      # The token is short-lived and only for this job: crates.io exchanges the job's OIDC token for it.
      - id: auth
        if: steps.crate.outputs.exists == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io (trusted publishing)
        if: steps.crate.outputs.exists == 'true'
        env:
          PATHS: ${{ inputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
          PUBLISH_REGISTRIES: crates
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"

  # Go and Swift upload nothing. This job only confirms the tag release-please made (fact-kit-go/vX.Y.Z, fact-kit-swift/vX.Y.Z), so
  # the run shows what was released and a missing tag fails here.
  tag:
    needs: plan
    if: needs.plan.outputs.tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm the tags
        env:
          PATHS: ${{ inputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_REGISTRIES: go,swift
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"

  # Pushes packages/fact-kit-go and packages/fact-kit-swift, with the package as the repository root, to the main
  # branch of their mirror repositories and tags the bare version there (Go v0.3.0-alpha.2, Swift 0.3.0-alpha.2).
  # It runs from this workflow rather than on a tag push because a tag made with GITHUB_TOKEN raises no events.
  # The mirror repositories take no pull requests; this job is their only writer. MIRROR_PUSH_TOKEN is a
  # fine-grained token (or GitHub App token) with contents: write on those two repositories and nothing else.
  # A dry run needs no token. Re-running is safe: see scripts/release/mirror-units.sh.
  mirror:
    needs: [plan, tag]
    if: needs.plan.outputs.tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One writer at a time, so two releases cannot race for the same main.
    concurrency:
      group: mirror
      cancel-in-progress: false
    steps:
      # Full history and tags: git subtree split reads every commit that touched the package.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Mirror the Go and Swift packages
        env:
          PATHS: ${{ inputs.paths }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          flags=()
          if [[ "$DRY_RUN" == 1 ]]; then flags=(--dry-run)
          elif [[ -z "$MIRROR_PUSH_TOKEN" ]]; then
            echo "::error::secret MIRROR_PUSH_TOKEN is not set, so nothing can be pushed to the mirror repositories"; exit 1
          fi
          bash scripts/release/mirror-units.sh ${flags[@]+"${flags[@]}"} "${paths[@]}"
