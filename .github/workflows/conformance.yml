name: conformance

# Every language reads the same samples in conformance/ and must produce the expected output. One job per
# language, named after it, that installs its toolchain and runs its conformance test against the same
# directory (conformance/README.md, last section). Each job also builds facts/dist, because every reader has a
# test that reads its own facts (fact-kit-facts/fact-kit-<language>) and checks the error codes against them.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
      - '!release/**--to-main'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # release-please opens its PRs with GITHUB_TOKEN, which does not trigger workflows (see ci.yml).
  js:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # verbose lists every case by name, so the log shows which samples ran, as the other languages do
      - run: pnpm conformance:js --reporter=verbose

  py:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The lowest Python the package supports (requires-python).
      - run: uv run --python 3.11 pytest -v
        working-directory: packages/fact-kit-py

  rs:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # rust-version in Cargo.toml, and the current stable.
        toolchain: ['1.95', stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked -- --nocapture
        working-directory: packages/fact-kit-rs

  go:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The go directive in go.mod, and the next release.
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: packages/fact-kit-go/go.sum
      # -count=1: the test cache does not see conformance/, which is outside the module, so a new sample
      # would otherwise be skipped by a cached result. FACT_KIT_CONFORMANCE makes a missing conformance/ fail;
      # without it the test skips (conformance_test.go).
      - run: go test -count=1 -v ./...
        working-directory: packages/fact-kit-go
        env:
          FACT_KIT_CONFORMANCE: ${{ github.workspace }}/conformance

  swift:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - run: xcodebuild -version && swift --version | head -1
      - run: swift test
        working-directory: packages/fact-kit-swift

  # SwiftPM builds on Linux as well, and the ubuntu runner image ships a Swift toolchain.
  swift-linux:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - run: swift --version | head -1
      - run: swift test
        working-directory: packages/fact-kit-swift
