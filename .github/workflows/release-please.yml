name: release-please

# Versioning engine, and it runs only on release branches: release/vX.Y, one per repository at a time,
# carrying the packages picked with cut-release.sh --units (today fact-kit in js/). main never carries
# a release-please commit. scripts/release/cut-release.sh scopes release-please-config.json to the
# train's packages and puts it in prerelease mode; finalize-release.sh --phase ga takes it back out.
# Merging the Release PR tags <component>/v<version> and creates the GitHub Release. A tag created with
# GITHUB_TOKEN raises no events, so this workflow dispatches publish.yml itself after a release, with the
# train's stage.
#
# A Release PR opened with GITHUB_TOKEN triggers a ci run that waits for approval. Set the repository
# variable RELEASE_PLEASE_APP_CLIENT_ID (and the RELEASE_PLEASE_APP_PRIVATE_KEY secret) and release-please
# runs as the App instead. Without them it falls back to GITHUB_TOKEN; everything else works either way.
#
# No workflow_dispatch: run by hand on main it would open a version PR against main.
on:
  push:
    branches:
      - 'release/**'
      # The branch that carries a train back to main is not a release branch and must not run
      # release-please again. "!" excludes within the same list; branches and branches-ignore cannot be mixed.
      - '!release/**--to-main'
    # Only a change to a unit or to the release config can change a version. Chore commits on a release
    # branch (restoring tooling, fixing the config) cannot, and each would cost a run. A workflow filter
    # cannot read the unit paths from release-please-config.json, so it names what is never a unit instead:
    # new units (py/, rs/, go/, facts/*) need no edit here. paths-ignore and branches are ANDed.
    paths-ignore:
      - 'scripts/**'
      - '.github/**'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      # Only when the App is configured; otherwise the step is skipped and its empty output falls
      # through to GITHUB_TOKEN below. The App needs Contents, Pull requests and Issues (write).
      - id: app-token
        if: vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summary
        env:
          RELEASES_CREATED: ${{ steps.rp.outputs.releases_created }}
          PRS_CREATED: ${{ steps.rp.outputs.prs_created }}
          PATHS_RELEASED: ${{ steps.rp.outputs.paths_released }}
        run: |
          {
            echo "### release-please on \`${GITHUB_REF_NAME}\`"
            echo "- releases_created: ${RELEASES_CREATED}"
            echo "- prs_created: ${PRS_CREATED}"
            echo "- paths_released: ${PATHS_RELEASED}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The stage comes from the branch's config (train_stage): alpha, beta or rc while it is in prerelease
      # mode, ga once it has left. publish.yml checks each package version against it, so a wrong stage
      # stops instead of publishing a prerelease under latest. publish.yml stays a workflow_dispatch target
      # run from here, never a workflow_call: npm trusts that file name as the Trusted Publisher.
      - name: Dispatch publish for released packages
        if: steps.rp.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ steps.rp.outputs.paths_released }}
        run: |
          pkgs=$(echo "$PATHS" | jq -c '.')
          if [[ "$pkgs" == "[]" ]]; then echo "no packages in this release"; exit 0; fi
          stage="$(bash -c 'source scripts/lib/common.sh && train_stage')"
          echo "dispatch publish.yml for $pkgs at stage $stage"
          gh workflow run publish.yml --ref "$GITHUB_REF_NAME" -f paths="$pkgs" -f stage="$stage"
