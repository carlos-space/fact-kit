name: facts-samples

# Samples/rust and samples/go install fact-kit-facts from npm with pnpm, as an outside project would, and read it
# through the published readers (crates.io fact-kit, Go module fact-kit-go). Samples/rust also builds its own facts.
on:
  pull_request:
    paths:
      - 'samples/**'
      - '.github/workflows/facts-samples.yml'
  push:
    branches: [main]
    paths:
      - 'samples/**'
      - '.github/workflows/facts-samples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: samples/rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install the facts packages
        run: pnpm install --frozen-lockfile
      - name: Build the facts of the sample
        run: pnpm -C facts build
      - name: Test the facts of the sample
        run: cargo test --locked --test own_facts
      - name: Test reading the installed package
        run: cargo test --locked --test installed_facts

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: samples/go
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install the facts package
        run: pnpm install --frozen-lockfile
      - name: Test reading the installed package
        run: go test ./...
