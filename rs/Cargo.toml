[package]
name = "fact-kit"
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.95"
description = "Read the facts of a fact-kit index.json from Rust"
license = "MIT"
repository = "https://github.com/carlos-space/fact-kit"
readme = "README.md"
# tests/ read conformance/ and facts/ outside the crate, so they only run in the repository
# .release-marker only lives on release branches (scripts/lib/release-stages.sh, release_as_commit)
exclude = ["tests/", ".release-marker"]
keywords = ["fact-kit", "facts", "semver"]

[lib]
name = "fact_kit"
path = "src/lib.rs"

[dependencies]
oxc_resolver = "11.24.3"
semver = "1.0.28"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
